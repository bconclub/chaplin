name: Chaplin version

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify commit-derived Chaplin version
        run: node scripts/version.mjs check
